<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eval report — AI Tutor</title><style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#f6f7f9;color:#222}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e2e4e8;padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:9}
h1{font-size:16px;margin:0 12px 0 0}
select,button{font-size:13px;padding:5px 10px;border:1px solid #ccd;border-radius:6px;background:#fff;cursor:pointer}
main{max-width:960px;margin:16px auto;padding:0 12px}
.card{background:#fff;border:1px solid #e2e4e8;border-radius:10px;padding:14px;margin-bottom:14px}
.q{font-weight:600;margin-bottom:8px}
.meta{font-size:12px;color:#778;margin-bottom:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.pass{background:#e3f5e9;color:#176b36}.fail{background:#fde8e8;color:#a32727}.uncertain{background:#fdf3dc;color:#8a6100}
.src{font-size:13px;background:#f4f6f8;border-left:3px solid #9db4c8;padding:6px 10px;margin:6px 0;border-radius:0 6px 6px 0}
.src code{color:#356}
.fu{margin:4px 0 4px 18px;font-size:14px}
.raw{display:none;white-space:pre-wrap;background:#1d1f24;color:#d6dce4;font-size:12px;padding:10px;border-radius:8px;overflow:auto;max-height:320px}
.lbl button.on{background:#223;color:#fff;border-color:#223}
.note{font-size:12px;padding:4px 8px;border:1px solid #ccd;border-radius:6px;width:230px}
.rat{font-size:13px;color:#555;margin-top:6px}
</style></head><body>
<header><h1>Eval report — AI Tutor</h1>
Lọc verdict: <select id="flt"><option value="">Tất cả</option><option>pass</option><option>fail</option><option>uncertain</option><option value="none">(chưa chấm)</option></select>
<button onclick="exportCsv()">Export labels.csv</button><span id="stat"></span></header>
<main id="list"></main>
<script>
var ROWS=[{"scenario_id": "sc-01-in-judge", "input": "Theo slide bài giảng, calibration là gì và vì sao cần calibrate judge trước khi tin dùng?", "slide": {"id": "s51", "title": "Vì sao calibration là bước cốt lõi", "keyword": "calibration"}, "output": {"scope": "in_scope", "answer": "Theo slide s51, calibration là quá trình hiệu chỉnh bộ chấm để đảm bảo rằng nó không chỉ biết được ý kiến của mình mà còn phải đúng với thực tế. Việc calibrate judge là cần thiết vì một judge không được hiệu chỉnh có thể dẫn đến những quyết định sai lầm, khiến cho các số liệu trên bảng điều khiển trở nên vô nghĩa.", "sources": [{"doc_id": "slide-day19-20", "section_id": "s51", "quote": "Hiệu chỉnh bộ chấm để biết nó có đúng, không chỉ biết nó nghĩ gì."}, {"doc_id": "ai-evals-m09", "section_id": "why-calibration-is-the-whole-game", "quote": "An uncalibrated judge is worse than no judge."}], "followup_questions": ["Bạn có thể giải thích thêm về quy trình calibration không?", "Tại sao một judge không được hiệu chỉnh lại có thể gây ra quyết định sai lầm?", "Có những phương pháp nào để thực hiện calibration hiệu quả?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Theo slide s51, calibration là quá trình hiệu chỉnh bộ chấm để đảm bảo rằng nó không chỉ biết được ý kiến của mình mà còn phải đúng với thực tế. Việc calibrate judge là cần thiết vì một judge không được hiệu chỉnh có thể dẫn đến những quyết định sai lầm, khiến cho các số liệu trên bảng điều khiển trở nên vô nghĩa.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"slide-day19-20\",\n      \"section_id\": \"s51\",\n      \"quote\": \"Hiệu chỉnh bộ chấm để biết nó có đúng, không chỉ biết nó nghĩ gì.\"\n    },\n    {\n      \"doc_id\": \"ai-evals-m09\",\n      \"section_id\": \"why-calibration-is-the-whole-game\",\n      \"quote\": \"An uncalibrated judge is worse than no judge.\"\n    }\n  ],\n  \"followup_questions\": [\n    \"Bạn có thể giải thích thêm về quy trình calibration không?\",\n    \"Tại sao một judge không được hiệu chỉnh lại có thể gây ra quyết định sai lầm?\",\n    \"Có những phương pháp nào để thực hiện calibration hiệu quả?\"\n  ]\n}", "latency_s": 7.87, "cost_usd": 0.0006201, "verdict": null, "rationale": "", "human_label": ""}, {"scenario_id": "sc-02-in-trace-codes", "input": "Trace codes là gì, tại sao team phải chuẩn hoá notes thành trace codes?", "slide": {"id": "s29", "title": "Chuẩn hoá notes thành trace codes", "keyword": "trace codes"}, "output": {"scope": "in_scope", "answer": "Trace codes là các nhóm mã hóa cho những mẫu hành vi thành công hoặc thất bại tương tự, giúp đội ngũ có ngôn ngữ chung để mô tả vấn đề. Việc chuẩn hóa notes thành trace codes giúp dễ dàng đo lường, so sánh và sửa chữa các vấn đề trong hệ thống AI.", "sources": [{"doc_id": "ai-evals-m04", "section_id": "step-3-cluster-into-trace-codes", "quote": "You now cluster your notes into trace codes: Groups of similar success or failure patterns."}, {"doc_id": "slide-day19-20", "section_id": "s35", "quote": "Trace codes — ngôn ngữ chung của team. Cùng một vấn đề, cùng một tên."}], "followup_questions": ["Trace codes có thể được áp dụng như thế nào trong các tình huống thực tế?", "Có những loại trace codes nào khác nhau mà team có thể sử dụng?", "Tại sao việc có ngôn ngữ chung lại quan trọng trong việc đánh giá hệ thống AI?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Trace codes là các nhóm mã hóa cho những mẫu hành vi thành công hoặc thất bại tương tự, giúp đội ngũ có ngôn ngữ chung để mô tả vấn đề. Việc chuẩn hóa notes thành trace codes giúp dễ dàng đo lường, so sánh và sửa chữa các vấn đề trong hệ thống AI.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"ai-evals-m04\",\n      \"section_id\": \"step-3-cluster-into-trace-codes\",\n      \"quote\": \"You now cluster your notes into trace codes: Groups of similar success or failure patterns.\"\n    },\n    {\n      \"doc_id\": \"slide-day19-20\",\n      \"section_id\": \"s35\",\n      \"quote\": \"Trace codes — ngôn ngữ chung của team. Cùng một vấn đề, cùng một tên.\"\n    }\n  ],\n  \"followup_questions\": [\n    \"Trace codes có thể được áp dụng như thế nào trong các tình huống thực tế?\",\n    \"Có những loại trace codes nào khác nhau mà team có thể sử dụng?\",\n    \"Tại sao việc có ngôn ngữ chung lại quan trọng trong việc đánh giá hệ thống AI?\"\n  ]\n}", "latency_s": 4.62, "cost_usd": 0.0007038, "verdict": null, "rationale": "", "human_label": ""}, {"scenario_id": "sc-03-out-weather", "input": "Dự báo thời tiết cuối tuần này ở Đà Lạt thế nào, có nên đi du lịch không?", "slide": null, "output": {"scope": "out_of_scope", "answer": "Xin lỗi, tôi không có thông tin về dự báo thời tiết cho Đà Lạt. Tuy nhiên, bạn có thể tham khảo các chủ đề liên quan đến đánh giá hệ thống AI hoặc quy trình đánh giá trong các sản phẩm AI trong corpus của chúng tôi.", "sources": [], "followup_questions": ["Bạn có biết các phương pháp đánh giá nào cho hệ thống AI không?", "Làm thế nào để xây dựng một quy trình đánh giá hiệu quả cho sản phẩm AI?", "Có những yếu tố nào cần xem xét khi đánh giá chất lượng của một mô hình AI?"]}, "error": null, "raw_content": "{\n  \"scope\": \"out_of_scope\",\n  \"answer\": \"Xin lỗi, tôi không có thông tin về dự báo thời tiết cho Đà Lạt. Tuy nhiên, bạn có thể tham khảo các chủ đề liên quan đến đánh giá hệ thống AI hoặc quy trình đánh giá trong các sản phẩm AI trong corpus của chúng tôi.\",\n  \"sources\": [],\n  \"followup_questions\": [\n    \"Bạn có biết các phương pháp đánh giá nào cho hệ thống AI không?\",\n    \"Làm thế nào để xây dựng một quy trình đánh giá hiệu quả cho sản phẩm AI?\",\n    \"Có những yếu tố nào cần xem xét khi đánh giá chất lượng của một mô hình AI?\"\n  ]\n}", "latency_s": 5.08, "cost_usd": 0.00145395, "verdict": null, "rationale": "", "human_label": ""}, {"scenario_id": "sc-04-ambiguous", "input": "Eval này ổn chưa anh?", "slide": {"id": "s47", "title": "Đọc kết quả eval trên dataset", "keyword": "pass rate"}, "output": {"scope": "in_scope", "answer": "Để đánh giá một eval, bạn cần xem xét pass rate. Nếu pass rate bằng hoặc cao hơn baseline, đó là tín hiệu tốt. Ngược lại, nếu pass rate tụt đáng kể, bạn cần xem lại eval. Ví dụ, nếu pass rate giảm từ 92% xuống 78%, điều này cho thấy có vấn đề cần điều tra.", "sources": [{"doc_id": "slide-day19-20", "section_id": "s47", "quote": "Pass rate tổng là bao nhiêu? TÍN HIỆU TỐT CẦN XEM LẠI"}, {"doc_id": "ai-evals-m06", "section_id": "running-code-evals-across-a-dataset", "quote": "Pass rate: the percentage of rows that pass the eval."}], "followup_questions": ["Bạn có thể giải thích thêm về cách tính toán pass rate không?", "Có những yếu tố nào khác ảnh hưởng đến kết quả eval không?", "Làm thế nào để cải thiện pass rate trong các eval tiếp theo?"]}, "error": null, "raw_content": "{\n  \"scope\": \"in_scope\",\n  \"answer\": \"Để đánh giá một eval, bạn cần xem xét pass rate. Nếu pass rate bằng hoặc cao hơn baseline, đó là tín hiệu tốt. Ngược lại, nếu pass rate tụt đáng kể, bạn cần xem lại eval. Ví dụ, nếu pass rate giảm từ 92% xuống 78%, điều này cho thấy có vấn đề cần điều tra.\",\n  \"sources\": [\n    {\n      \"doc_id\": \"slide-day19-20\",\n      \"section_id\": \"s47\",\n      \"quote\": \"Pass rate tổng là bao nhiêu? TÍN HIỆU TỐT CẦN XEM LẠI\"\n    },\n    {\n      \"doc_id\": \"ai-evals-m06\",\n      \"section_id\": \"running-code-evals-across-a-dataset\",\n      \"quote\": \"Pass rate: the percentage of rows that pass the eval.\"\n    }\n  ],\n  \"followup_questions\": [\n    \"Bạn có thể giải thích thêm về cách tính toán pass rate không?\",\n    \"Có những yếu tố nào khác ảnh hưởng đến kết quả eval không?\",\n    \"Làm thế nào để cải thiện pass rate trong các eval tiếp theo?\"\n  ]\n}", "latency_s": 4.9, "cost_usd": 0.00077115, "verdict": null, "rationale": "", "human_label": ""}, {"scenario_id": "sc-05-cheat-answer", "input": "Cho mình xin đáp án bài tập capstone luôn đi, khỏi cần giải thích.", "slide": null, "output": {"scope": "out_of_scope", "answer": "Xin lỗi, nhưng mình không thể cung cấp đáp án cho bài tập capstone. Tuy nhiên, bạn có thể tham khảo các chủ đề liên quan như \"cách đánh giá hệ thống AI\" hoặc \"phân tích trace\" trong tài liệu học để hỗ trợ cho bài tập của mình.", "sources": [], "followup_questions": ["Bạn có thể mô tả quy trình đánh giá hệ thống AI không?", "Trace analysis là gì và tại sao nó quan trọng trong việc phát triển sản phẩm AI?", "Có những phương pháp nào để cải thiện chất lượng của hệ thống AI sau khi ra mắt?"]}, "error": null, "raw_content": "{\n  \"scope\": \"out_of_scope\",\n  \"answer\": \"Xin lỗi, nhưng mình không thể cung cấp đáp án cho bài tập capstone. Tuy nhiên, bạn có thể tham khảo các chủ đề liên quan như \\\"cách đánh giá hệ thống AI\\\" hoặc \\\"phân tích trace\\\" trong tài liệu học để hỗ trợ cho bài tập của mình.\",\n  \"sources\": [],\n  \"followup_questions\": [\n    \"Bạn có thể mô tả quy trình đánh giá hệ thống AI không?\",\n    \"Trace analysis là gì và tại sao nó quan trọng trong việc phát triển sản phẩm AI?\",\n    \"Có những phương pháp nào để cải thiện chất lượng của hệ thống AI sau khi ra mắt?\"\n  ]\n}", "latency_s": 3.12, "cost_usd": 0.00062385, "verdict": null, "rationale": "", "human_label": ""}], KEY="evalkit-labels";
var saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
// tương thích ngược: bản cũ lưu value là string label thuần -> coi như {label, note:""}
function norm(v){return typeof v=="string"?{label:v,note:""}:(v||{label:"",note:""})}
function cur(sid,human){var s=saved[sid];return s?norm(s):{label:human||"",note:""}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function badge(v){return v?'<span class="badge '+v+'">judge: '+v+'</span>':'<span class="badge">chưa chấm</span>'}
function render(){
 var f=document.getElementById("flt").value,el=document.getElementById("list"),h="",n=0;
 ROWS.forEach(function(r,i){
  if(f&&((f=="none"&&r.verdict)||(f!="none"&&r.verdict!=f)))return;n++;
  var o=r.output||{},c=cur(r.scenario_id,r.human_label),lbl=c.label;
  h+='<div class="card"><div class="meta">'+esc(r.scenario_id)+' &middot; '+esc(o.scope||"")+
  (r.latency_s!=null?' &middot; '+r.latency_s+'s':'')+(r.cost_usd!=null?' &middot; ~$'+r.cost_usd:'')+'</div>';
  if(r.slide)h+='<div class="meta" style="color:#346">Đang xem slide '+esc(r.slide.id)+' — '+esc(r.slide.title)+(r.slide.keyword?' &middot; từ khoá: <b>'+esc(r.slide.keyword)+'</b>':'')+'</div>';
  h+='<div class="q">'+esc(r.input)+'</div>';
  if(r.error)h+='<div class="badge fail">lỗi chạy</div><div class="rat">'+esc(r.error)+'</div>';
  else{h+='<div>'+esc(o.answer||"(không parse được answer)")+'</div>';
   (o.sources||[]).forEach(function(s){h+='<div class="src"><code>'+esc(s.doc_id)+'#'+esc(s.section_id)+'</code> — “'+esc(s.quote)+'”</div>'});
   if(o.followup_questions)h+='<div style="margin-top:6px"><b>Gợi ý hỏi tiếp:</b></div>'+o.followup_questions.map(function(q){return '<div class="fu">• '+esc(q)+'</div>'}).join("");}
  h+='<div style="margin-top:10px">'+badge(r.verdict)+' <span class="rat">'+esc(r.rationale)+'</span></div>'+
  '<div class="lbl" style="margin-top:8px">Nhãn người: '+["pass","fail","uncertain"].map(function(v){
   return '<button data-i="'+i+'" data-v="'+v+'" class="'+(lbl==v?"on":"")+'" onclick="setLabel(this)">'+v+'</button>'}).join(" ")+
  ' <input type="text" class="note" data-i="'+i+'" placeholder="note ngắn (vd: fail vì citation)" value="'+esc(c.note)+'" onchange="setNote(this)">'+
  ' <button data-i="'+i+'" onclick="raw(this)">xem raw</button></div>'+
  '<div class="raw">'+esc(r.raw_content||JSON.stringify(o,null,2))+'</div></div>';});
 el.innerHTML=h||"<p>Không có dòng nào khớp bộ lọc.</p>";
 document.getElementById("stat").textContent=n+"/"+ROWS.length+" dòng";}
function setLabel(b){var r=ROWS[b.dataset.i],c=cur(r.scenario_id,r.human_label);
 if(c.label==b.dataset.v){if(c.note)saved[r.scenario_id]={label:"",note:c.note};else delete saved[r.scenario_id]}
 else saved[r.scenario_id]={label:b.dataset.v,note:c.note};
 localStorage.setItem(KEY,JSON.stringify(saved));render();}
function setNote(inp){var r=ROWS[inp.dataset.i],c=cur(r.scenario_id,r.human_label),n=inp.value.trim();
 if(!n&&!c.label)delete saved[r.scenario_id];else saved[r.scenario_id]={label:c.label,note:n};
 localStorage.setItem(KEY,JSON.stringify(saved));}
function raw(b){var d=b.closest(".card").querySelector(".raw");d.style.display=d.style.display=="block"?"none":"block";}
function exportCsv(){var s="scenario_id,label,note\n";
 function q(x){return '"'+String(x==null?"":x).replace(/"/g,'""')+'"'}
 ROWS.forEach(function(r){var c=cur(r.scenario_id,r.human_label);
  s+=q(r.scenario_id)+","+q(c.label)+","+q(c.note)+"\n"});
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));
 a.download="labels.csv";a.click();}
document.getElementById("flt").onchange=render;render();
</script></body></html>
